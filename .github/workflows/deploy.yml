name: Test and deploy

# The site is two builds (V-234): the live one from main at /Kadr/, and the release candidate from the branch `next` at
# /Kadr/next/, where the owner checks a release on the iPhone before it goes live (scripts/l5-prerelease.mjs).
# GitHub Pages replaces the whole site on each deploy, so every deploy carries both: a release of main keeps /next/,
# and a push to next redeploys main as it is.
on:
  push:
    branches: [main, next]
    paths-ignore: ['docs/**', 'reports/**'] # notes do not change the site: no deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # the build reads the code and nothing else; only the deploy job may touch the site (audit V-230)

# A deploy is never cancelled halfway (GitHub's Pages template), and deploys of main and next wait for each other: both
# write the one site. Pull requests only cancel their own runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions on Node 24 (GitHub retires Node 20 for actions). The live site is always main, whatever started the run.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts # third-party install scripts do not run where the site is built (audit V-230)
      - name: Lint and dead code
        run: npm run lint
      - name: Typecheck and unit tests
        run: npm run check
      - name: Production build
        run: npm run build
        env:
          KADR_BASE: /Kadr/
          # Anonymous statistics (G-3, src/lib/events.ts): the owner's Aptabase app key, a repository variable. Unset, the
          # site has no sink and sends nothing; set, its one host joins the CSP and the Privacy page says what goes there.
          KADR_EVENTS_KEY: ${{ vars.KADR_EVENTS_KEY }}
      # The candidate, when the branch `next` exists: built from it with names of its own in the browser's storage
      # (VITE_STAGE, src/lib/stage.ts), its own service worker at /Kadr/next/, noindex, and the speech models read from
      # the live site's copy (two copies do not fit in 1 GB). A candidate that does not build fails a push to next; a
      # release of main goes on without it, and /next/ is gone until next builds again.
      - name: Build the candidate (branch next) into dist/next
        id: next
        if: github.event_name != 'pull_request'
        continue-on-error: ${{ github.ref != 'refs/heads/next' }}
        run: |
          if ! git ls-remote --exit-code --heads origin next > /dev/null; then echo "no branch next: the site is main alone"; exit 0; fi
          git fetch --depth=1 origin next
          git worktree add ../next FETCH_HEAD
          cd ../next
          npm ci --ignore-scripts
          npm run lint
          npm run check
          VITE_BUILD_SHA="$(git rev-parse --short HEAD)" npm run build -- --outDir "$GITHUB_WORKSPACE/dist/next" --emptyOutDir
          echo "built=yes" >> "$GITHUB_OUTPUT"
        env:
          KADR_BASE: /Kadr/next/
          VITE_STAGE: next
          VITE_MODEL_BASE: /Kadr/
      # The main path on Chromium before anything is deployed (docs/12 stage 6): open, sample, split, undo, export. The
      # candidate too, when it is there.
      - name: Smoke test the build in a browser
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4191 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4191/Kadr/ > /dev/null && break; sleep 1; done
          E2E_URL=http://localhost:4191/Kadr/ npx playwright test e2e/qa-smoke.spec.ts --project android-chromium
          # The candidate's own smoke test, from its own checkout: its screens may differ from main's.
          if [ -f dist/next/index.html ]; then (cd ../next && E2E_URL=http://localhost:4191/Kadr/next/ npx playwright test e2e/qa-smoke.spec.ts --project android-chromium); fi
        env:
          KADR_BASE: /Kadr/
      # The speech models on Kadr's own site (docs/12 stage 5): downloaded from Hugging Face once, kept between runs,
      # checked against src/engine/models.json, and put next to the app before the past versions are counted in.
      - name: Cache the speech models
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: scripts/.model-cache
          key: models-${{ hashFiles('src/engine/models.json') }}
          restore-keys: models- # an older cache still holds the files that did not change
      - name: Put the speech models on the site
        if: github.event_name != 'pull_request'
        run: node scripts/mirror-models.mjs dist
      # A tab opened before this deploy keeps loading its own code (docs/12, deploy skew): the files of the last
      # deployments go back into the site next to the new ones. Counted within the site's budget with dist/next in it.
      - name: Keep the files of recent deployments
        if: github.event_name != 'pull_request'
        run: node scripts/keep-assets.mjs https://timofeys22.github.io/Kadr/ dist
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist
          retention-days: 30 # a known-good build to redeploy for a rollback (docs/12 G7)
          # v4+ leaves out files starting with a dot; v1.4.15's voice-effects chunk is one (".dist-*.js"), and a tab
          # still on it needs it (docs/12 G9: files of past versions stay ≥ 30 days).
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v6 # main: the version the live site must show, whatever started the run
        with:
          ref: main
      - name: Smoke test the live site (the new version and every kept file)
        run: node scripts/smoke-live.mjs https://timofeys22.github.io/Kadr/ "$(node -p "require('./package.json').version")"
      # The check above asks for the files; only a browser shows that the code in them runs (audit V-128).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts # third-party install scripts do not run where the site is built (audit V-230)
      - run: npx playwright install --with-deps chromium
      - name: The live site runs (open, edit, export)
        run: E2E_URL=https://timofeys22.github.io/Kadr/ npx playwright test e2e/qa-smoke.spec.ts --project=android-chromium
      - name: The candidate runs, when it is there
        run: |
          if curl -sf https://timofeys22.github.io/Kadr/next/ > /dev/null; then
            E2E_URL=https://timofeys22.github.io/Kadr/next/ npx playwright test e2e/qa-smoke.spec.ts --project=android-chromium
          else echo "no candidate at /Kadr/next/"; fi
