name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'reports/**'] # notes do not change the site: no deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy of main is never cancelled halfway (GitHub's Pages template); pull requests only cancel their own runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and unit tests
        run: npm run check
      - name: Production build
        run: npm run build
        env:
          KADR_BASE: /Kadr/
      # A tab opened before this deploy keeps loading its own code (docs/12, deploy skew): the files of the last
      # deployments go back into the site next to the new ones.
      - name: Keep the files of recent deployments
        if: github.ref == 'refs/heads/main'
        run: node scripts/keep-assets.mjs https://timofeys22.github.io/Kadr/ dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Smoke test the live site (the new version and every kept file)
        run: node scripts/smoke-live.mjs https://timofeys22.github.io/Kadr/ "$(node -p "require('./package.json').version")"
