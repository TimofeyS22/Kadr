name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'reports/**'] # notes do not change the site: no deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy of main is never cancelled halfway (GitHub's Pages template); pull requests only cancel their own runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions on Node 24 (GitHub retires Node 20 for actions).
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and unit tests
        run: npm run check
      - name: Production build
        run: npm run build
        env:
          KADR_BASE: /Kadr/
      # The main path on Chromium before anything is deployed (docs/12 stage 6): open, sample, split, undo, export.
      - name: Smoke test the build in a browser
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4191 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4191/Kadr/ > /dev/null && break; sleep 1; done
          E2E_URL=http://localhost:4191/Kadr/ npx playwright test e2e/qa-smoke.spec.ts --project android-chromium
        env:
          KADR_BASE: /Kadr/
      # A tab opened before this deploy keeps loading its own code (docs/12, deploy skew): the files of the last
      # deployments go back into the site next to the new ones.
      - name: Keep the files of recent deployments
        if: github.ref == 'refs/heads/main'
        run: node scripts/keep-assets.mjs https://timofeys22.github.io/Kadr/ dist
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
          retention-days: 30 # a known-good build to redeploy for a rollback (docs/12 G7)
          # v4+ leaves out files starting with a dot; v1.4.15's voice-effects chunk is one (".dist-*.js"), and a tab
          # still on it needs it (docs/12 G9: files of past versions stay ≥ 30 days).
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v6
      - name: Smoke test the live site (the new version and every kept file)
        run: node scripts/smoke-live.mjs https://timofeys22.github.io/Kadr/ "$(node -p "require('./package.json').version")"
